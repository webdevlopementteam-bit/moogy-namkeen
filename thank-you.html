<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Moogy Namkeen</title>

    <meta name="description" content="Thanks for reaching out to Moogy Namkeen. Our team will get back to you soon.">
    <meta name="robots" content="noindex">

    <link rel="icon" href="images/logo.png" sizes="any">
    <link rel="icon" href="images/logo.png" sizes="32x32" type="image/png">

    <meta name="theme-color" content="#e63b41">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        .thankyou-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: var(--cream);
        }

        .thankyou-card {
            max-width: 560px;
            background: #ffffff;
            border: var(--line);
            box-shadow: var(--pop);
            border-radius: 28px;
            padding: 50px 40px;
        }

        .thankyou-logo {
            width: 90px;
            margin: 0 auto 20px;
        }

        .thankyou-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .thankyou-card h1 {
            font-family: "Fredoka", sans-serif;
            font-size: 32px;
            margin-bottom: 14px;
        }

        .thankyou-card h1 span {
            color: var(--red);
        }

        .thankyou-card p {
            font-size: 16px;
            line-height: 1.7;
            color: var(--ink);
            opacity: 0.85;
            margin-bottom: 28px;
        }

    </style>

</head>

<body>

<section class="thankyou-section">

    <div class="thankyou-card">

        <img src="images/logo.png" alt="Moogy Namkeen" class="thankyou-logo">

        <div class="thankyou-icon">🎉</div>

        <h1>Thank You, <span>Snack Lover!</span></h1>

        <p>
            Your message has landed with the Moogy Namkeen team.
            We'll get back to you very soon.
        </p>

        <a href="index.html" class="primary-btn">
            Back To Home
            <span>→</span>
        </a>

    </div>

</section>

</body>

</html>
